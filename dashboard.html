<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İdarə Paneli | Eco Start-up Club</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --stk-navy: #091a30;
            --stk-navy-light: #122b4d;
            --stk-gold: #ffc107;
            --stk-gold-hover: #e0a800;
            --stk-gold-glow: rgba(255, 193, 7, 0.25);
            --eco-green: #10b981;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-light: #475569;
            --border-color: #e2e8f0;
            --role-bg: #f8fafc;
            --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.1);
        }
        body.dark-theme {
            --stk-navy: #030812;
            --stk-navy-light: #091325;
            --bg-color: #040914;
            --card-bg: #0b1528;
            --text-color: #f8fafc;
            --text-light: #94a3b8;
            --border-color: #1e293b;
            --role-bg: #111c33;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; }
        header { background: var(--stk-navy-light); position: sticky; top: 0; z-index: 1000; box-shadow: var(--shadow-md); border-bottom: 3px solid var(--stk-gold); }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .brand-logo-group { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-img { height: 48px; width: auto; object-fit: contain; }
        .brand-title { font-weight: 800; font-size: 1.15rem; color: #ffffff; }
        .nav-right-wrapper { display: flex; align-items: center; gap: 15px; }
        .theme-toggle-btn { background: var(--stk-gold); border: none; color: var(--stk-navy); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        
        .dashboard-container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .user-welcome-card { background: var(--card-bg); border-radius: 14px; padding: 25px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-sm); margin-bottom: 30px; }
        .user-info h2 { font-size: 1.4rem; color: var(--stk-navy); }
        body.dark-theme .user-info h2 { color: var(--stk-gold); }
        .role-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; margin-top: 5px; }
        .role-badge.tier1 { background: rgba(255, 193, 7, 0.2); color: var(--stk-gold); border: 1px solid var(--stk-gold); }
        .role-badge.tier2 { background: rgba(224, 168, 0, 0.15); color: var(--stk-gold-hover); border: 1px solid var(--stk-gold-hover); }
        .role-badge.tier3 { background: rgba(16, 185, 129, 0.2); color: var(--eco-green); border: 1px solid var(--eco-green); }
        .role-badge.tier4 { background: rgba(100, 116, 139, 0.2); color: var(--text-light); border: 1px solid var(--border-color); }
        
        .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; }
        .dash-card { background: var(--card-bg); border-radius: 14px; border: 1px solid var(--border-color); padding: 25px; box-shadow: var(--shadow-sm); }
        .dash-card-header { display: flex; align-items: center; justify-content: space-between; font-size: 1.15rem; font-weight: 700; color: var(--stk-navy); border-bottom: 2px solid var(--border-color); padding-bottom: 12px; margin-bottom: 18px; }
        body.dark-theme .dash-card-header { color: var(--stk-gold); }
        
        .announcement-box { background: var(--bg-color); border-left: 4px solid var(--stk-gold); padding: 14px; border-radius: 6px; margin-bottom: 12px; }
        .announcement-box h4 { font-size: 0.95rem; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .announcement-box p { font-size: 0.85rem; color: var(--text-light); white-space: pre-line; }
        .announcement-box .meta { font-size: 0.75rem; color: var(--text-light); margin-top: 6px; display: flex; justify-content: space-between; align-items: center; }
        
        .post-form textarea, .post-form input, .post-form select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); margin-bottom: 10px; outline: none; }
        .post-form textarea { resize: vertical; min-height: 80px; }
        .writer-only, .tier1-only { display: none; }
        
        .btn { padding: 8px 18px; border-radius: 6px; text-decoration: none; font-weight: 700; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; border: none; }
        .btn-gold { background: linear-gradient(135deg, #ffc107, #ffb300); color: #091a30; box-shadow: 0 4px 14px var(--stk-gold-glow); }
        .btn-gold:hover { transform: translateY(-2px); }
        .btn-outline { background-color: transparent; color: var(--text-color); border: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="brand-logo-group">
                <img src="https://i.postimg.cc/59KBvbxD/logo.png" alt="Logo" class="logo-img">
                <div class="brand-text"><span class="brand-title">ECO START-UP CLUB</span></div>
            </a>
            <div class="nav-right-wrapper">
                <button class="theme-toggle-btn" id="themeToggle"><i class="fa-solid fa-moon"></i></button>
                <button class="btn btn-gold" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Çıxış</button>
            </div>
        </div>
    </header>

    <main class="dashboard-container">
        <div class="user-welcome-card">
            <div class="user-info">
                <h2 id="displayUserName">Xoş gəldiniz!</h2>
                <span class="role-badge tier4" id="displayUserRole">Üzv</span>
            </div>
            <div><a href="index.html" class="btn btn-outline"><i class="fa-solid fa-house"></i> Ana Səhifə</a></div>
        </div>

        <div class="dash-grid">
            <!-- TIER 1: İSTİFADƏÇİ İDARƏETMƏSİ -->
            <div class="dash-card tier1-only" id="userManagementCard">
                <div class="dash-card-header"><span><i class="fa-solid fa-users-gear" style="color: var(--stk-gold);"></i> İstifadəçi İdarəsi (Tier 1)</span></div>
                <form class="post-form" onsubmit="addNewUser(event)">
                    <input type="text" id="newUsername" placeholder="İstifadəçi adı (məs: elvin)" required>
                    <input type="password" id="newUserPassword" placeholder="Şifrə" required>
                    <input type="text" id="newFullName" placeholder="Ad və Soyad" required>
                    <select id="newUserRole" required>
                        <option value="tier1">Tier 1 (Rəhbərlik)</option>
                        <option value="tier2">Tier 2 (Koordinator)</option>
                        <option value="tier3">Tier 3 (Departament rəhbəri)</option>
                        <option value="tier4" selected>Tier 4 (Üzv)</option>
                    </select>
                    <select id="newUserDept" required>
                        <option value="general">Ümumi</option>
                        <option value="sl">Startup (sl)</option>
                        <option value="ti">Tədbirlər (ti)</option>
                        <option value="it">IT (it)</option>
                        <option value="iet">İctimai Əlaqələr (iet)</option>
                        <option value="d">Dizayn (d)</option>
                    </select>
                    <button type="submit" class="btn btn-gold" style="width:100%; justify-content:center;"><i class="fa-solid fa-user-plus"></i> İstifadəçi Əlavə Et</button>
                </form>
                <div style="margin-top: 15px; max-height: 200px; overflow-y: auto;" id="systemUsersList"></div>
            </div>

            <!-- ELAN YARATMA -->
            <div class="dash-card writer-only" id="postAnnouncementCard">
                <div class="dash-card-header"><span><i class="fa-solid fa-bullhorn" style="color: var(--stk-gold);"></i> Yeni Elan Paylaş</span></div>
                <form class="post-form" onsubmit="publishAnnouncement(event)">
                    <select id="annDepartment" required>
                        <option value="general">Ümumi Kanal (Rəhbərlik & Koordinatorlar)</option>
                        <option value="sl">Startup və Layihələr (sl)</option>
                        <option value="ti">Tədbirlər və İnkişaf (ti)</option>
                        <option value="it">IT Departamenti (it)</option>
                        <option value="iet">İctimai Əlaqələr və Tərəfdaşlıq (iet)</option>
                        <option value="d">Dizayn Departamenti (d)</option>
                    </select>
                    <input type="text" id="annTitle" placeholder="Elanın başlığı" required>
                    <textarea id="annBody" placeholder="Mətn..." required></textarea>
                    <button type="submit" class="btn btn-gold" id="btnSubmitAnn" style="width:100%; justify-content:center;"><i class="fa-solid fa-paper-plane"></i> Paylaş</button>
                </form>
            </div>

            <!-- ARXİV ƏLAVƏ ET -->
            <div class="dash-card writer-only" id="addArchiveCard">
                <div class="dash-card-header"><span><i class="fa-solid fa-file-circle-plus" style="color: var(--eco-green);"></i> Arxivə Fayl Əlavə Et</span></div>
                <form class="post-form" onsubmit="addArchiveFile(event)">
                    <select id="fileDepartment" required>
                        <option value="general">Ümumi Arxiv</option>
                        <option value="sl">Startup Arxiv</option>
                        <option value="ti">Tədbirlər Arxiv</option>
                        <option value="it">IT Arxiv</option>
                        <option value="iet">İctimai Əlaqələr Arxiv</option>
                        <option value="d">Dizayn Arxiv</option>
                    </select>
                    <input type="text" id="fileTitle" placeholder="Fayl adı" required>
                    <input type="url" id="fileUrl" placeholder="Link (Google Drive və s.)" required>
                    <button type="submit" class="btn btn-gold" id="btnSubmitFile" style="width:100%; justify-content:center;"><i class="fa-solid fa-upload"></i> Əlavə Et</button>
                </form>
            </div>

            <!-- ARXİVLƏR LİSTİ -->
            <div class="dash-card">
                <div class="dash-card-header">
                    <span><i class="fa-solid fa-folder-open"></i> Arxivlər</span>
                    <select id="archiveFilter" onchange="renderArchives()" style="font-size:0.8rem; padding:4px;">
                        <option value="all">Bütün Arxivlər</option>
                        <option value="general">Ümumi</option>
                        <option value="sl">Startup (sl)</option>
                        <option value="ti">Tədbirlər (ti)</option>
                        <option value="it">IT (it)</option>
                        <option value="iet">İctimai Əlaqələr (iet)</option>
                        <option value="d">Dizayn (d)</option>
                    </select>
                </div>
                <ul id="archiveList" style="list-style: none; font-size: 0.9rem; color: var(--text-light); line-height: 1.8;"></ul>
            </div>

            <!-- ELANLAR LİSTİ -->
            <div class="dash-card">
                <div class="dash-card-header">
                    <span><i class="fa-solid fa-scroll"></i> Elanlar və Kanallar</span>
                    <select id="announcementFilter" onchange="renderAnnouncements()" style="font-size:0.8rem; padding:4px;">
                        <option value="all">Bütün Kanallar</option>
                        <option value="general">Ümumi</option>
                        <option value="sl">Startup (sl)</option>
                        <option value="ti">Tədbirlər (ti)</option>
                        <option value="it">IT (it)</option>
                        <option value="iet">İctimai Əlaqələr (iet)</option>
                        <option value="d">Dizayn (d)</option>
                    </select>
                </div>
                <div id="announcementList" style="max-height: 450px; overflow-y: auto;"></div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2q8vmp6j9ZXeMK-Cquq24VBy7ot3T-j8",
            authDomain: "eco-startup-site.firebaseapp.com",
            projectId: "eco-startup-site",
            storageBucket: "eco-startup-site.firebasestorage.app",
            messagingSenderId: "177745640190",
            appId: "1:177745640190:web:f8096c55e42224befa43af"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUserSession = null;

        window.addEventListener('DOMContentLoaded', () => {
            const sessionData = localStorage.getItem('currentUser');
            if (!sessionData) {
                window.location.replace('login.html');
            } else {
                currentUserSession = JSON.parse(sessionData);
                document.getElementById('displayUserName').innerText = `Xoş gəldiniz, ${currentUserSession.name}!`;
                const roleBadge = document.getElementById('displayUserRole');
                roleBadge.innerText = currentUserSession.roleDisplayName;
                roleBadge.className = `role-badge ${currentUserSession.role}`;

                if (currentUserSession.role !== 'tier4') {
                    document.querySelectorAll('.writer-only').forEach(el => el.style.display = 'block');
                }

                if (currentUserSession.role === 'tier1') {
                    document.getElementById('userManagementCard').style.display = 'block';
                    renderSystemUsers();
                }

                renderAnnouncements();
                renderArchives();
            }
        });

        window.addNewUser = async function(e) {
            e.preventDefault();
            const username = document.getElementById('newUsername').value.trim().toLowerCase();
            const password = document.getElementById('newUserPassword').value.trim();
            const name = document.getElementById('newFullName').value.trim();
            const role = document.getElementById('newUserRole').value;
            const department = document.getElementById('newUserDept').value;

            try {
                await addDoc(collection(db, "users"), {
                    username,
                    password,
                    name,
                    role,
                    department,
                    createdAt: Date.now()
                });
                document.getElementById('newUsername').value = '';
                document.getElementById('newUserPassword').value = '';
                document.getElementById('newFullName').value = '';
                alert("İstifadəçi uğurla əlavə olundu!");
                renderSystemUsers();
            } catch (err) {
                alert("Xəta: " + err.message);
            }
        };

        window.renderSystemUsers = async function() {
            const container = document.getElementById('systemUsersList');
            if (!container) return;
            container.innerHTML = '<p style="font-size:0.8rem; color:var(--text-light);">Yüklənir...</p>';

            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                container.innerHTML = '';
                
                if (querySnapshot.empty) {
                    container.innerHTML = '<p style="font-size:0.8rem; color:var(--text-light);">İstifadəçi yoxdur.</p>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const u = docSnap.data();
                    const docId = docSnap.id;

                    container.innerHTML += `
                        <div style="background:var(--bg-color); padding:8px; border-radius:6px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; font-size:0.85rem;">
                            <div>
                                <strong>${u.name}</strong> <span style="color:var(--text-light); font-size:0.75rem;">(@${u.username})</span><br>
                                <span style="font-size:0.7rem; color:var(--stk-gold);">[${u.role.toUpperCase()} - ${u.department.toUpperCase()}]</span>
                            </div>
                            <button onclick="deleteSystemUser('${docId}')" class="btn btn-outline" style="padding:2px 6px; font-size:0.7rem; color:#e53935; border-color:#e53935;"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                });
            } catch (err) {
                container.innerHTML = `<p style="color:#e53935; font-size:0.8rem;">Xəta: ${err.message}</p>`;
            }
        };

        window.deleteSystemUser = async function(docId) {
            if (confirm("Bu istifadəçini silmək istədiyinizə əminsiniz?")) {
                try {
                    await deleteDoc(doc(db, "users", docId));
                    renderSystemUsers();
                    alert("İstifadəçi silindi.");
                } catch (err) {
                    alert("Xəta: " + err.message);
                }
            }
        };

        window.renderAnnouncements = async function() {
            const container = document.getElementById('announcementList');
            const filter = document.getElementById('announcementFilter').value;
            if (!container) return;
            container.innerHTML = '<p style="font-size:0.85rem; color:var(--text-light); padding:10px;">Yüklənir...</p>';
            
            try {
                const querySnapshot = await getDocs(collection(db, "announcements"));
                let announcements = [];
                querySnapshot.forEach((docSnap) => {
                    announcements.push({ docId: docSnap.id, ...docSnap.data() });
                });

                announcements.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                container.innerHTML = '';
                const filtered = announcements.filter(ann => filter === 'all' || ann.department === filter);

                if (filtered.length === 0) {
                    container.innerHTML = '<p style="font-size:0.85rem; color:var(--text-light); text-align:center; padding:15px;">Hələ ki, elan yoxdur.</p>';
                    return;
                }

                filtered.forEach((ann) => {
                    const myTier = currentUserSession.role;
                    const isMyMessage = currentUserSession.username === ann.authorUsername || currentUserSession.name === ann.author;
                    
                    let canModify = false;
                    if (myTier === 'tier1') canModify = true;
                    else if (myTier === 'tier2') canModify = (isMyMessage || ann.authorRole === 'tier3' || ann.authorRole === 'tier4');
                    else if (myTier === 'tier3') canModify = isMyMessage;

                    const safeTitle = ann.title ? ann.title.replace(/'/g, "\\'").replace(/"/g, "&quot;") : "";
                    const safeBody = ann.body ? ann.body.replace(/'/g, "\\'").replace(/"/g, "&quot;") : "";

                    container.innerHTML += `
                        <div class="announcement-box">
                            <h4>${ann.title} <span style="font-size:0.7rem; background:var(--role-bg); padding:2px 6px; border-radius:4px;">${ann.department.toUpperCase()}</span></h4>
                            <p>${ann.body}</p>
                            <div class="meta">
                                <span><i class="fa-regular fa-user"></i> ${ann.author} (${ann.date})</span>
                                ${canModify ? `
                                    <div style="display: flex; gap: 6px;">
                                        <button onclick="editAnnouncement('${ann.docId}', '${safeTitle}', '${safeBody}')" class="btn btn-outline" style="padding: 2px 6px; font-size: 0.7rem; color: var(--stk-gold); border-color: var(--stk-gold);">Redaktə</button>
                                        <button onclick="deleteAnnouncement('${ann.docId}')" class="btn btn-outline" style="padding: 2px 6px; font-size: 0.7rem; color: #e53935; border-color: #e53935;">Sil</button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                container.innerHTML = `<p style="color:#e53935; font-size:0.85rem;">Xəta: ${err.message}</p>`;
            }
        };

        window.publishAnnouncement = async function(e) {
            e.preventDefault();
            const dept = document.getElementById('annDepartment').value;
            const title = document.getElementById('annTitle').value.trim();
            const body = document.getElementById('annBody').value.trim();
            const btn = document.getElementById('btnSubmitAnn');

            if (currentUserSession.role === 'tier3' && dept !== 'general' && dept !== currentUserSession.department) {
                alert("Siz yalnız Ümumi kanala və öz departamentinizə yazı yaza bilərsiniz!");
                return;
            }

            try {
                btn.disabled = true;
                btn.innerText = "Göndərilir...";
                await addDoc(collection(db, "announcements"), {
                    title,
                    body,
                    department: dept,
                    date: new Date().toLocaleDateString('az-AZ'),
                    author: currentUserSession.name,
                    authorUsername: currentUserSession.username,
                    authorRole: currentUserSession.role,
                    createdAt: Date.now()
                });

                document.getElementById('annTitle').value = '';
                document.getElementById('annBody').value = '';
                await renderAnnouncements();
                alert('Elan uğurla paylaşıldı!');
            } catch (err) {
                alert("Xəta baş verdi: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Paylaş';
            }
        };

        window.editAnnouncement = async function(docId, currentTitle, currentBody) {
            const newTitle = prompt("Yeni başlıq:", currentTitle);
            const newBody = prompt("Yeni mətn:", currentBody);

            if (newTitle !== null && newBody !== null && newTitle.trim() !== "" && newBody.trim() !== "") {
                try {
                    await updateDoc(doc(db, "announcements", docId), {
                        title: newTitle.trim(),
                        body: newBody.trim()
                    });
                    alert("Elan yeniləndi!");
                    await renderAnnouncements();
                } catch (err) {
                    alert("Xəta: " + err.message);
                }
            }
        };

        window.deleteAnnouncement = async function(docId) {
            if (confirm("Silmək istədiyinizə əminsiniz?")) {
                try {
                    await deleteDoc(doc(db, "announcements", docId));
                    await renderAnnouncements();
                } catch (err) {
                    alert("Xəta: " + err.message);
                }
            }
        };

        window.renderArchives = async function() {
            const listContainer = document.getElementById('archiveList');
            const filter = document.getElementById('archiveFilter').value;
            if (!listContainer) return;
            listContainer.innerHTML = '<li style="font-size:0.85rem; color:var(--text-light);">Yüklənir...</li>';
            
            try {
                const querySnapshot = await getDocs(collection(db, "archives"));
                let archiveFiles = [];
                querySnapshot.forEach((docSnap) => {
                    archiveFiles.push({ docId: docSnap.id, ...docSnap.data() });
                });

                archiveFiles.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                listContainer.innerHTML = '';
                const filtered = archiveFiles.filter(file => filter === 'all' || file.department === filter);

                if (filtered.length === 0) {
                    listContainer.innerHTML = '<li style="font-size:0.85rem; color:var(--text-light); text-align:center;">Fayl yoxdur.</li>';
                    return;
                }

                filtered.forEach((file) => {
                    const myTier = currentUserSession.role;
                    const isMyFile = currentUserSession.username === file.authorUsername || currentUserSession.name === file.author;
                    let canDelete = (myTier === 'tier1' || myTier === 'tier2' || (myTier === 'tier3' && isMyFile));

                    listContainer.innerHTML += `
                        <li style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <a href="${file.url}" target="_blank" style="color: var(--text-light); text-decoration: none;">
                                <i class="fa-solid fa-file-pdf" style="color: #e53935;"></i> ${file.name} <span style="font-size:0.7rem; color:var(--stk-gold);">[${file.department.toUpperCase()}]</span>
                            </a>
                            ${canDelete ? `<button onclick="deleteArchive('${file.docId}')" style="background:transparent; border:none; color:#e53935; cursor:pointer; font-size:0.8rem;"><i class="fa-solid fa-trash"></i></button>` : ''}
                        </li>
                    `;
                });
            } catch (err) {
                listContainer.innerHTML = `<li style="color:#e53935; font-size:0.85rem;">Xəta: ${err.message}</li>`;
            }
        };

        window.addArchiveFile = async function(e) {
            e.preventDefault();
            const dept = document.getElementById('fileDepartment').value;
            const name = document.getElementById('fileTitle').value.trim();
            const url = document.getElementById('fileUrl').value.trim();
            const btn = document.getElementById('btnSubmitFile');

            if (currentUserSession.role === 'tier3' && dept !== 'general' && dept !== currentUserSession.department) {
                alert("Siz yalnız Ümumi arxivə və öz departamentinizə fayl əlavə edə bilərsiniz!");
                return;
            }

            try {
                btn.disabled = true;
                btn.innerText = "Əlavə edilir...";
                await addDoc(collection(db, "archives"), {
                    name,
                    url,
                    department: dept,
                    author: currentUserSession.name,
                    authorUsername: currentUserSession.username,
                    createdAt: Date.now()
                });

                document.getElementById('fileTitle').value = '';
                document.getElementById('fileUrl').value = '';
                await renderArchives();
                alert('Fayl əlavə olundu!');
            } catch (err) {
                alert("Xəta baş verdi: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-upload"></i> Əlavə Et';
            }
        };

        window.deleteArchive = async function(docId) {
            if (confirm("Silmək istədiyinizə əminsiniz?")) {
                try {
                    await deleteDoc(doc(db, "archives", docId));
                    await renderArchives();
                } catch (err) {
                    alert("Xəta: " + err.message);
                }
            }
        };

        window.logout = function() {
            localStorage.removeItem('currentUser');
            window.location.replace('login.html');
        };

        document.getElementById('themeToggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
        });
    </script>
</body>
</html>
