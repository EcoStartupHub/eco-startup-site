<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İdarə Paneli | Eco Start-up Club</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <style>
        .dashboard-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .user-welcome-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 25px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
            margin-bottom: 30px;
        }

        .user-info h2 {
            font-size: 1.4rem;
            color: var(--stk-navy);
        }

        body.dark-theme .user-info h2 {
            color: var(--stk-gold);
        }

        .role-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .role-badge.admin {
            background: rgba(241, 184, 18, 0.2);
            color: var(--stk-gold);
            border: 1px solid var(--stk-gold);
        }

        .role-badge.user {
            background: rgba(46, 125, 50, 0.2);
            color: var(--eco-green);
            border: 1px solid var(--eco-green);
        }

        .dash-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .dash-card {
            background: var(--card-bg);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            padding: 25px;
            box-shadow: var(--shadow-sm);
        }

        .dash-card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--stk-navy);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 18px;
        }

        body.dark-theme .dash-card-header {
            color: var(--stk-gold);
        }

        .announcement-box {
            background: var(--bg-color);
            border-left: 4px solid var(--stk-gold);
            padding: 14px;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .announcement-box h4 {
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .announcement-box p {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .announcement-box .date {
            font-size: 0.75rem;
            color: var(--text-light);
            margin-top: 6px;
            display: block;
        }

        .post-form textarea, .post-form input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            margin-bottom: 10px;
            outline: none;
        }

        .post-form textarea {
            resize: vertical;
            min-height: 80px;
        }

        .admin-only, .user-only {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="nav-container">
            <a href="index.html" class="brand-logo-group">
                <img src="https://i.postimg.cc/59KBvbxD/logo.png" alt="Logo" class="logo-img">
                <div class="brand-text">
                    <span class="brand-title">ECO START-UP CLUB</span>
                </div>
            </a>

            <div class="nav-right-wrapper">
                <button class="theme-toggle-btn" id="themeToggle"><i class="fa-solid fa-moon"></i></button>
                <button class="btn btn-gold" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Çıxış</button>
            </div>
        </div>
    </header>

    <main class="dashboard-container">
        
        <!-- İstifadəçi Məlumat Kartı -->
        <div class="user-welcome-card">
            <div class="user-info">
                <h2 id="displayUserName">Xoş gəldiniz!</h2>
                <span class="role-badge" id="displayUserRole">İstifadəçi</span>
            </div>
            <div>
                <a href="index.html" class="btn btn-outline" style="color: var(--text-color); border-color: var(--border-color);"><i class="fa-solid fa-house"></i> Ana Səhifəyə Qayıt</a>
            </div>
        </div>

        <!-- DASHBOARD GRID -->
        <div class="dash-grid">

            <!-- ADMIN-ONLY: Yeni Elan Paylaşma Bölməsi -->
            <div class="dash-card admin-only">
                <div class="dash-card-header">
                    <i class="fa-solid fa-bullhorn" style="color: var(--stk-gold);"></i> Yeni Elan Paylaş
                </div>
                <form class="post-form" onsubmit="publishAnnouncement(event)">
                    <input type="text" id="annTitle" placeholder="Elanın başlığı" required>
                    <textarea id="annBody" placeholder="Elanın mətnini yazın..." required></textarea>
                    <button type="submit" class="btn btn-gold" style="width: 100%; justify-content: center;"><i class="fa-solid fa-paper-plane"></i> Paylaş</button>
                </form>
            </div>

            <!-- ADMIN-ONLY: Arxivə Fayl Əlavə Etmə -->
            <div class="dash-card admin-only">
                <div class="dash-card-header">
                    <i class="fa-solid fa-file-circle-plus" style="color: var(--eco-green);"></i> Arxivə Fayl Əlavə Et
                </div>
                <form class="post-form" onsubmit="addArchiveFile(event)">
                    <input type="text" id="fileTitle" placeholder="Faylın adı (məsələn: Hesabat.pdf)" required>
                    <input type="url" id="fileUrl" placeholder="Faylın linki (Google Drive və s.)" required>
                    <button type="submit" class="btn btn-gold" style="width: 100%; justify-content: center;"><i class="fa-solid fa-upload"></i> Faylı Əlavə Et</button>
                </form>
            </div>

            <!-- HƏM ADMİN, HƏM USER: Departament Keçmişi və Arxiv -->
            <div class="dash-card">
                <div class="dash-card-header">
                    <i class="fa-solid fa-folder-open" style="color: var(--stk-navy);"></i> Arxiv və Sənədlər
                </div>
                <ul id="archiveList" style="list-style: none; font-size: 0.9rem; color: var(--text-light); line-height: 1.8;">
                    <!-- Dinamik arxiv faylları bura yüklənəcək -->
                </ul>
            </div>

            <!-- HƏM ADMİN, HƏM USER: Elanlar Kanalı (Redaktə və Silmə dəstəyi ilə) -->
            <div class="dash-card">
                <div class="dash-card-header">
                    <i class="fa-solid fa-scroll" style="color: var(--stk-gold);"></i> Elanlar və Bildirişlər
                </div>
                <div id="announcementList">
                    <!-- Dinamik Elanlar bura düşəcək -->
                </div>
            </div>

        </div>

    </main>

    <!-- Firebase və Dashboard JavaScript Modulu -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2q8vmp6j9ZXeMK-Cquq24VBy7ot3T-j8",
            authDomain: "eco-startup-site.firebaseapp.com",
            projectId: "eco-startup-site",
            storageBucket: "eco-startup-site.firebasestorage.app",
            messagingSenderId: "177745640190",
            appId: "1:177745640190:web:f8096c55e42224befa43af",
            measurementId: "G-MSG6DJE36D"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let currentUserSession = null;

        // Firebase Sessiya Yoxlanışı
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                localStorage.removeItem('currentUser');
                window.location.replace('index.html');
            } else {
                currentUserSession = JSON.parse(localStorage.getItem('currentUser'));
                if (currentUserSession) {
                    const userNameElem = document.getElementById('displayUserName');
                    const roleBadge = document.getElementById('displayUserRole');

                    if (userNameElem) userNameElem.innerText = `Xoş gəldiniz, ${currentUserSession.name}!`;
                    
                    if (roleBadge) {
                        if (currentUserSession.role === 'admin') {
                            roleBadge.innerText = 'Admin / İdarə Heyəti';
                            roleBadge.classList.add('admin');
                            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
                        } else {
                            roleBadge.innerText = 'Klub Üzvü';
                            roleBadge.classList.add('user');
                            document.querySelectorAll('.user-only').forEach(el => el.style.display = 'block');
                        }
                    }
                    renderAnnouncements();
                    renderArchives();
                }
            }
        });

        // Elanlar İdarəetməsi
        let announcements = JSON.parse(localStorage.getItem('clubAnnouncements')) || [
            {
                title: "Klub İclasının Vaxtı Təyin Olundu",
                body: "Gələn həftənin 2-ci günü Sənaye və Texnologiya Kollecinin akt zalında ümumi görüşümüz keçiriləcək.",
                date: "18 Oktyabr 2026"
            }
        ];

        window.renderAnnouncements = function() {
            const container = document.getElementById('announcementList');
            if (!container) return;
            container.innerHTML = '';
            
            announcements.forEach((ann, index) => {
                const isAdmin = currentUserSession && currentUserSession.role === 'admin';
                container.innerHTML += `
                    <div class="announcement-box">
                        <h4>${ann.title}</h4>
                        <p>${ann.body}</p>
                        <span class="date"><i class="fa-regular fa-clock"></i> ${ann.date}</span>
                        
                        ${isAdmin ? `
                            <div style="margin-top: 10px; display: flex; gap: 8px;">
                                <button onclick="editAnnouncement(${index})" class="btn btn-outline" style="padding: 2px 8px; font-size: 0.75rem; color: var(--stk-gold); border-color: var(--stk-gold);">Redaktə</button>
                                <button onclick="deleteAnnouncement(${index})" class="btn btn-outline" style="padding: 2px 8px; font-size: 0.75rem; color: #e53935; border-color: #e53935;">Sil</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            });
        };

        window.publishAnnouncement = function(e) {
            e.preventDefault();
            const titleElem = document.getElementById('annTitle');
            const bodyElem = document.getElementById('annBody');

            if (!titleElem || !bodyElem) return;

            const title = titleElem.value;
            const body = bodyElem.value;
            const date = new Date().toLocaleDateString('az-AZ');

            announcements.unshift({ title, body, date });
            localStorage.setItem('clubAnnouncements', JSON.stringify(announcements));
            
            titleElem.value = '';
            bodyElem.value = '';
            renderAnnouncements();
            alert('Elan uğurla paylaşıldı!');
        };

        window.deleteAnnouncement = function(index) {
            if (confirm("Bu elanı silmək istədiyinizə əminsiniz?")) {
                announcements.splice(index, 1);
                localStorage.setItem('clubAnnouncements', JSON.stringify(announcements));
                renderAnnouncements();
            }
        };

        window.editAnnouncement = function(index) {
            const ann = announcements[index];
            const newTitle = prompt("Yeni başlığı daxil edin:", ann.title);
            const newBody = prompt("Yeni mətnini daxil edin:", ann.body);

            if (newTitle !== null && newBody !== null) {
                announcements[index].title = newTitle.trim();
                announcements[index].body = newBody.trim();
                localStorage.setItem('clubAnnouncements', JSON.stringify(announcements));
                renderAnnouncements();
            }
        };

        // Arxiv Faylları İdarəetməsi
        let archiveFiles = JSON.parse(localStorage.getItem('clubArchives')) || [
            { name: "2025-2026 İdarəetmə Hesabatı.pdf", url: "#" },
            { name: "Sədr və Kurator Protokolu.docx", url: "#" }
        ];

        window.renderArchives = function() {
            const listContainer = document.getElementById('archiveList');
            if (!listContainer) return;
            listContainer.innerHTML = '';
            
            archiveFiles.forEach((file, index) => {
                const isAdmin = currentUserSession && currentUserSession.role === 'admin';
                listContainer.innerHTML += `
                    <li style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <a href="${file.url}" target="_blank" style="color: var(--text-light); text-decoration: none;">
                            <i class="fa-solid fa-file-pdf" style="color: #e53935;"></i> ${file.name}
                        </a>
                        ${isAdmin ? `<button onclick="deleteArchive(${index})" style="background:transparent; border:none; color:#e53935; cursor:pointer; font-size:0.8rem;"><i class="fa-solid fa-trash"></i></button>` : ''}
                    </li>
                `;
            });
        };

        window.addArchiveFile = function(e) {
            e.preventDefault();
            const name = document.getElementById('fileTitle').value;
            const url = document.getElementById('fileUrl').value;

            archiveFiles.unshift({ name, url });
            localStorage.setItem('clubArchives', JSON.stringify(archiveFiles));
            
            document.getElementById('fileTitle').value = '';
            document.getElementById('fileUrl').value = '';
            alert('Fayl arxivə əlavə olundu!');
            renderArchives();
        };

        window.deleteArchive = function(index) {
            if (confirm("Bu faylı arxivdən silmək istədiyinizə əminsiniz?")) {
                archiveFiles.splice(index, 1);
                localStorage.setItem('clubArchives', JSON.stringify(archiveFiles));
                renderArchives();
            }
        };

        // Çıxış Funksiyası
        window.logout = async function() {
            try {
                await signOut(auth);
            } catch (err) {
                console.error("Çıxış xətası:", err);
            }
            localStorage.removeItem('currentUser');
            window.location.replace('index.html');
        };

        // Tünd Rejim Dəyişdiricisi
        const themeToggle = document.getElementById('themeToggle');
        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-theme');
            });
        }
    </script>
</body>
</html>
