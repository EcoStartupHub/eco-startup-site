<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İdarə Paneli | Eco Start-up Club</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --stk-navy: #0b2341;
            --stk-navy-light: #16365d;
            --stk-gold: #f1b812;
            --stk-gold-hover: #d9a30a;
            --eco-green: #2e7d32;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-light: #64748b;
            --border-color: #e2e8f0;
            --role-bg: #f1f5f9;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
        }
        body.dark-theme {
            --stk-navy: #071527;
            --stk-navy-light: #0f2746;
            --bg-color: #06101e;
            --card-bg: #0f1d30;
            --text-color: #f1f5f9;
            --text-light: #94a3b8;
            --border-color: #1e293b;
            --role-bg: #1e293b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; }
        header { background: var(--stk-navy-light); position: sticky; top: 0; z-index: 1000; box-shadow: var(--shadow-md); border-bottom: 3px solid var(--stk-gold); }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .brand-logo-group { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-img { height: 48px; width: auto; object-fit: contain; }
        .brand-title { font-weight: 800; font-size: 1.15rem; color: #ffffff; }
        .nav-right-wrapper { display: flex; align-items: center; gap: 15px; }
        .theme-toggle-btn { background: var(--stk-gold); border: none; color: var(--stk-navy); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        
        .dashboard-container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .user-welcome-card { background: var(--card-bg); border-radius: 14px; padding: 25px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-sm); margin-bottom: 30px; }
        .user-info h2 { font-size: 1.4rem; color: var(--stk-navy); }
        body.dark-theme .user-info h2 { color: var(--stk-gold); }
        .role-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; margin-top: 5px; }
        .role-badge.tier1 { background: rgba(241, 184, 18, 0.2); color: var(--stk-gold); border: 1px solid var(--stk-gold); }
        .role-badge.tier2 { background: rgba(217, 163, 10, 0.15); color: var(--stk-gold-hover); border: 1px solid var(--stk-gold-hover); }
        .role-badge.tier3 { background: rgba(46, 125, 50, 0.2); color: var(--eco-green); border: 1px solid var(--eco-green); }
        .role-badge.tier4 { background: rgba(100, 116, 139, 0.2); color: var(--text-light); border: 1px solid var(--border-color); }
        
        .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; }
        .dash-card { background: var(--card-bg); border-radius: 14px; border: 1px solid var(--border-color); padding: 25px; box-shadow: var(--shadow-sm); }
        .dash-card-header { display: flex; align-items: center; justify-content: space-between; font-size: 1.15rem; font-weight: 700; color: var(--stk-navy); border-bottom: 2px solid var(--border-color); padding-bottom: 12px; margin-bottom: 18px; }
        body.dark-theme .dash-card-header { color: var(--stk-gold); }
        
        .announcement-box { background: var(--bg-color); border-left: 4px solid var(--stk-gold); padding: 14px; border-radius: 6px; margin-bottom: 12px; }
        .announcement-box h4 { font-size: 0.95rem; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .announcement-box p { font-size: 0.85rem; color: var(--text-light); }
        .announcement-box .meta { font-size: 0.75rem; color: var(--text-light); margin-top: 6px; display: flex; justify-content: space-between; align-items: center; }
        
        .post-form textarea, .post-form input, .post-form select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); margin-bottom: 10px; outline: none; }
        .post-form textarea { resize: vertical; min-height: 80px; }
        .writer-only { display: none; }
        
        .btn { padding: 8px 18px; border-radius: 6px; text-decoration: none; font-weight: 700; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; border: none; }
        .btn-gold { background-color: var(--stk-gold); color: var(--stk-navy); }
        .btn-gold:hover { background-color: var(--stk-gold-hover); }
        .btn-outline { background-color: transparent; color: var(--text-color); border: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="brand-logo-group">
                <img src="https://i.postimg.cc/59KBvbxD/logo.png" alt="Logo" class="logo-img">
                <div class="brand-text"><span class="brand-title">ECO START-UP CLUB</span></div>
            </a>
            <div class="nav-right-wrapper">
                <button class="theme-toggle-btn" id="themeToggle"><i class="fa-solid fa-moon"></i></button>
                <button class="btn btn-gold" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Çıxış</button>
            </div>
        </div>
    </header>

    <main class="dashboard-container">
        <div class="user-welcome-card">
            <div class="user-info">
                <h2 id="displayUserName">Xoş gəldiniz!</h2>
                <span class="role-badge tier4" id="displayUserRole">Üzv</span>
            </div>
            <div><a href="index.html" class="btn btn-outline"><i class="fa-solid fa-house"></i> Ana Səhifə</a></div>
        </div>

        <div class="dash-grid">
            <div class="dash-card writer-only" id="postAnnouncementCard">
                <div class="dash-card-header"><span><i class="fa-solid fa-bullhorn" style="color: var(--stk-gold);"></i> Yeni Elan Paylaş</span></div>
                <form class="post-form" onsubmit="publishAnnouncement(event)">
                    <select id="annDepartment" required>
                        <option value="general">Ümumi Kanal (Rəhbərlik & Koordinatorlar)</option>
                        <option value="sl">Startup və Layihələr (sl)</option>
                        <option value="ti">Tədbirlər və İnkişaf (ti)</option>
                        <option value="it">IT Departamenti (it)</option>
                        <option value="iet">İctimai Əlaqələr və Tərəfdaşlıq (iet)</option>
                        <option value="d">Dizayn Departamenti (d)</option>
                    </select>
                    <input type="text" id="annTitle" placeholder="Elanın başlığı" required>
                    <textarea id="annBody" placeholder="Mətn..." required></textarea>
                    <button type="submit" class="btn btn-gold" style="width:100%; justify-content:center;"><i class="fa-solid fa-paper-plane"></i> Paylaş</button>
                </form>
            </div>

            <div class="dash-card writer-only" id="addArchiveCard">
                <div class="dash-card-header"><span><i class="fa-solid fa-file-circle-plus" style="color: var(--eco-green);"></i> Arxivə Fayl Əlavə Et</span></div>
                <form class="post-form" onsubmit="addArchiveFile(event)">
                    <select id="fileDepartment" required>
                        <option value="general">Ümumi Arxiv</option>
                        <option value="sl">Startup Arxiv</option>
                        <option value="ti">Tədbirlər Arxiv</option>
                        <option value="it">IT Arxiv</option>
                        <option value="iet">İctimai Əlaqələr Arxiv</option>
                        <option value="d">Dizayn Arxiv</option>
                    </select>
                    <input type="text" id="fileTitle" placeholder="Fayl adı" required>
                    <input type="url" id="fileUrl" placeholder="Link (Google Drive və s.)" required>
                    <button type="submit" class="btn btn-gold" style="width:100%; justify-content:center;"><i class="fa-solid fa-upload"></i> Əlavə Et</button>
                </form>
            </div>

            <div class="dash-card">
                <div class="dash-card-header">
                    <span><i class="fa-solid fa-folder-open"></i> Arxivlər (Bütün kanallara baxış)</span>
                    <select id="archiveFilter" onchange="renderArchives()" style="font-size:0.8rem; padding:4px;">
                        <option value="all">Bütün Arxivlər</option>
                        <option value="general">Ümumi</option>
                        <option value="sl">Startup (sl)</option>
                        <option value="ti">Tədbirlər (ti)</option>
                        <option value="it">IT (it)</option>
                        <option value="iet">İctimai Əlaqələr (iet)</option>
                        <option value="d">Dizayn (d)</option>
                    </select>
                </div>
                <ul id="archiveList" style="list-style: none; font-size: 0.9rem; color: var(--text-light); line-height: 1.8;"></ul>
            </div>

            <div class="dash-card">
                <div class="dash-card-header">
                    <span><i class="fa-solid fa-scroll"></i> Elanlar və Kanallar</span>
                    <select id="announcementFilter" onchange="renderAnnouncements()" style="font-size:0.8rem; padding:4px;">
                        <option value="all">Bütün Kanallar</option>
                        <option value="general">Ümumi</option>
                        <option value="sl">Startup (sl)</option>
                        <option value="ti">Tədbirlər (ti)</option>
                        <option value="it">IT (it)</option>
                        <option value="iet">İctimai Əlaqələr (iet)</option>
                        <option value="d">Dizayn (d)</option>
                    </select>
                </div>
                <div id="announcementList" style="max-height: 450px; overflow-y: auto;"></div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2q8vmp6j9ZXeMK-Cquq24VBy7ot3T-j8",
            authDomain: "eco-startup-site.firebaseapp.com",
            projectId: "eco-startup-site",
            storageBucket: "eco-startup-site.firebasestorage.app",
            messagingSenderId: "177745640190",
            appId: "1:177745640190:web:f8096c55e42224befa43af",
            measurementId: "G-MSG6DJE36D"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let currentUserSession = null;

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                localStorage.removeItem('currentUser');
                window.location.replace('login.html');
            } else {
                currentUserSession = JSON.parse(localStorage.getItem('currentUser'));
                if (currentUserSession) {
                    document.getElementById('displayUserName').innerText = `Xoş gəldiniz, ${currentUserSession.name}!`;
                    const roleBadge = document.getElementById('displayUserRole');
                    roleBadge.innerText = currentUserSession.roleDisplayName;
                    roleBadge.className = `role-badge ${currentUserSession.role}`;

                    if (currentUserSession.role !== 'tier4') {
                        document.querySelectorAll('.writer-only').forEach(el => el.style.display = 'block');
                    }
                    renderAnnouncements();
                    renderArchives();
                }
            }
        });

        let announcements = JSON.parse(localStorage.getItem('clubAnnouncements')) || [
            { id: 1, title: "Klub İclasının Vaxtı", body: "Ümumi görüş keçiriləcək.", date: "18.10.2026", department: "general", author: "ibrahim1", authorRole: "tier1" }
        ];

        window.renderAnnouncements = function() {
            const container = document.getElementById('announcementList');
            const filter = document.getElementById('announcementFilter').value;
            if (!container) return;
            container.innerHTML = '';
            
            const filtered = announcements.filter(ann => filter === 'all' || ann.department === filter);

            filtered.forEach((ann) => {
                const index = announcements.findIndex(a => a.id === ann.id);
                const myTier = currentUserSession.role;
                const isMyMessage = currentUserSession.username === ann.author;
                
                let canModify = false;
                if (myTier === 'tier1') {
                    canModify = true;
                } else if (myTier === 'tier2') {
                    canModify = (isMyMessage || ann.authorRole === 'tier3' || ann.authorRole === 'tier4');
                } else if (myTier === 'tier3') {
                    canModify = isMyMessage;
                }

                container.innerHTML += `
                    <div class="announcement-box">
                        <h4>${ann.title} <span style="font-size:0.7rem; background:var(--role-bg); padding:2px 6px; border-radius:4px;">${ann.department.toUpperCase()}</span></h4>
                        <p>${ann.body}</p>
                        <div class="meta">
                            <span><i class="fa-regular fa-user"></i> ${ann.author} (${ann.date})</span>
                            ${canModify ? `
                                <div style="display: flex; gap: 6px;">
                                    <button onclick="editAnnouncement(${index})" class="btn btn-outline" style="padding: 2px 6px; font-size: 0.7rem; color: var(--stk-gold); border-color: var(--stk-gold);">Redaktə</button>
                                    <button onclick="deleteAnnouncement(${index})" class="btn btn-outline" style="padding: 2px 6px; font-size: 0.7rem; color: #e53935; border-color: #e53935;">Sil</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            });
        };

        window.publishAnnouncement = function(e) {
            e.preventDefault();
            const dept = document.getElementById('annDepartment').value;
            const title = document.getElementById('annTitle').value;
            const body = document.getElementById('annBody').value;

            if (currentUserSession.role === 'tier3' && dept !== 'general' && dept !== currentUserSession.department) {
                alert("Siz yalnız Ümumi kanala və öz departamentinizə yazı yaza bilərsiniz!");
                return;
            }

            announcements.unshift({
                id: Date.now(),
                title,
                body,
                department: dept,
                date: new Date().toLocaleDateString('az-AZ'),
                author: currentUserSession.username,
                authorRole: currentUserSession.role
            });

            localStorage.setItem('clubAnnouncements', JSON.stringify(announcements));
            document.getElementById('annTitle').value = '';
            document.getElementById('annBody').value = '';
            renderAnnouncements();
            alert('Elan uğurla paylaşıldı!');
        };

        window.deleteAnnouncement = function(index) {
            if (confirm("Silmək istədiyinizə əminsiniz?")) {
                announcements.splice(index, 1);
                localStorage.setItem('clubAnnouncements', JSON.stringify(announcements));
                renderAnnouncements();
            }
        };

        window.editAnnouncement = function(index) {
            const ann = announcements[index];
            const newTitle = prompt("Yeni başlıq:", ann.title);
            const newBody = prompt("Yeni mətn:", ann.body);
            if (newTitle !== null && newBody !== null) {
                announcements[index].title = newTitle.trim();
                announcements[index].body = newBody.trim();
                localStorage.setItem('clubAnnouncements', JSON.stringify(announcements));
                renderAnnouncements();
            }
        };

        let archiveFiles = JSON.parse(localStorage.getItem('clubArchives')) || [
            { id: 1, name: "Hesabat.pdf", url: "#", department: "general", author: "ibrahim1" }
        ];

        window.renderArchives = function() {
            const listContainer = document.getElementById('archiveList');
            const filter = document.getElementById('archiveFilter').value;
            if (!listContainer) return;
            listContainer.innerHTML = '';
            
            const filtered = archiveFiles.filter(file => filter === 'all' || file.department === filter);

            filtered.forEach((file) => {
                const index = archiveFiles.findIndex(f => f.id === file.id);
                const myTier = currentUserSession.role;
                const isMyFile = currentUserSession.username === file.author;
                
                let canDelete = (myTier === 'tier1' || (myTier === 'tier2') || (myTier === 'tier3' && isMyFile));

                listContainer.innerHTML += `
                    <li style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <a href="${file.url}" target="_blank" style="color: var(--text-light); text-decoration: none;">
                            <i class="fa-solid fa-file-pdf" style="color: #e53935;"></i> ${file.name} <span style="font-size:0.7rem; color:var(--stk-gold);">[${file.department.toUpperCase()}]</span>
                        </a>
                        ${canDelete ? `<button onclick="deleteArchive(${index})" style="background:transparent; border:none; color:#e53935; cursor:pointer; font-size:0.8rem;"><i class="fa-solid fa-trash"></i></button>` : ''}
                    </li>
                `;
            });
        };

        window.addArchiveFile = function(e) {
            e.preventDefault();
            const dept = document.getElementById('fileDepartment').value;
            const name = document.getElementById('fileTitle').value;
            const url = document.getElementById('fileUrl').value;

            if (currentUserSession.role === 'tier3' && dept !== 'general' && dept !== currentUserSession.department) {
                alert("Siz yalnız Ümumi arxivə və öz departamentinizə fayl əlavə edə bilərsiniz!");
                return;
            }

            archiveFiles.unshift({ id: Date.now(), name, url, department: dept, author: currentUserSession.username });
            localStorage.setItem('clubArchives', JSON.stringify(archiveFiles));
            document.getElementById('fileTitle').value = '';
            document.getElementById('fileUrl').value = '';
            alert('Fayl əlavə olundu!');
            renderArchives();
        };

        window.deleteArchive = function(index) {
            if (confirm("Silmək istədiyinizə əminsiniz?")) {
                archiveFiles.splice(index, 1);
                localStorage.setItem('clubArchives', JSON.stringify(archiveFiles));
                renderArchives();
            }
        };

        window.logout = async function() {
            try { await signOut(auth); } catch (err) {}
            localStorage.removeItem('currentUser');
            window.location.replace('login.html');
        };

        document.getElementById('themeToggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
        });
    </script>
</body>
</html>
