<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daxil Ol | Eco Start-up Club</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --stk-navy: #091a30;
            --stk-navy-light: #122b4d;
            --stk-gold: #ffc107;
            --stk-gold-glow: rgba(255, 193, 7, 0.25);
            --bg-color: #040914;
            --card-bg: #0b1528;
            --text-color: #f8fafc;
            --text-light: #94a3b8;
            --border-color: #1e293b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-card { background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border-color); padding: 35px 25px; width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        .login-card img { height: 55px; margin-bottom: 15px; object-fit: contain; }
        .login-card h2 { color: var(--stk-gold); margin-bottom: 5px; font-weight: 800; font-size: 1.35rem; letter-spacing: 0.5px; }
        .login-card p { color: var(--text-light); font-size: 0.8rem; margin-bottom: 22px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-light); margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color); background: #040914; color: #fff; outline: none; font-size: 0.9rem; }
        .form-group input:focus { border-color: var(--stk-gold); box-shadow: 0 0 8px var(--stk-gold-glow); }
        .btn-login { width: 100%; padding: 11px; border-radius: 8px; border: none; background: linear-gradient(135deg, #ffc107, #ffb300); color: #091a30; font-weight: 800; font-size: 0.9rem; cursor: pointer; margin-top: 5px; box-shadow: 0 4px 14px var(--stk-gold-glow); transition: transform 0.2s; }
        .btn-login:hover { transform: translateY(-2px); }
        .error-msg { color: #f43f5e; font-size: 0.8rem; margin-top: 12px; display: none; background: rgba(244, 63, 94, 0.1); padding: 8px; border-radius: 6px; border: 1px solid rgba(244, 63, 94, 0.2); }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="https://i.postimg.cc/59KBvbxD/logo.png" alt="Eco Start-Up Logo">
        <h2>ECO START-UP</h2>
        <p>İdarə Panelinə Giriş</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">İstifadəçi Adı</label>
                <input type="text" id="username" placeholder="İstifadəçi adınızı daxil edin" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">Şifrə</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login" id="btnLogin">Daxil Ol</button>
            <div class="error-msg" id="errorMsg"></div>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2q8vmp6j9ZXeMK-Cquq24VBy7ot3T-j8",
            authDomain: "eco-startup-site.firebaseapp.com",
            projectId: "eco-startup-site",
            storageBucket: "eco-startup-site.firebasestorage.app",
            messagingSenderId: "177745640190",
            appId: "1:177745640190:web:f8096c55e42224befa43af"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        if (localStorage.getItem('currentUser')) {
            window.location.replace('dashboard.html');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value.trim().toLowerCase();
            const passwordInput = document.getElementById('password').value;
            const btn = document.getElementById('btnLogin');
            const errorDiv = document.getElementById('errorMsg');

            errorDiv.style.display = 'none';
            btn.disabled = true;
            btn.innerText = "Yoxlanılır...";

            try {
                const usersRef = collection(db, "users");
                const q = query(usersRef, where("username", "==", usernameInput), where("password", "==", passwordInput));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    let userData = null;
                    querySnapshot.forEach((docSnap) => {
                        userData = { id: docSnap.id, ...docSnap.data() };
                    });

                    let roleDisplayName = "Üzv (Tier 4)";
                    if (userData.role === 'tier1') roleDisplayName = "Sədr / Rəhbər (Tier 1)";
                    else if (userData.role === 'tier2') roleDisplayName = "Koordinator (Tier 2)";
                    else if (userData.role === 'tier3') roleDisplayName = "Departament Rəhbəri (Tier 3)";

                    const sessionUser = {
                        docId: userData.id,
                        username: userData.username,
                        name: userData.name,
                        role: userData.role,
                        roleDisplayName: roleDisplayName,
                        department: userData.department || 'general'
                    };

                    localStorage.setItem('currentUser', JSON.stringify(sessionUser));
                    window.location.replace('dashboard.html');
                } else {
                    errorDiv.innerText = "İstifadəçi adı və ya şifrə yanlışdır!";
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.innerText = "Xəta baş verdi: " + err.message;
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = "Daxil Ol";
            }
        });
    </script>
</body>
</html>
